<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{root}}styles/style.css"/>
  <title>{{title}} – Just a Blog</title>
</head>
<body>
  <header>
    <div class="logo">
        <img src="{{root}}images/moon.png" alt="Logo">
        <h2>Just a Blog</h2>
    </div>

    <button class="hamburger" aria-label="Toggle navigation"
            aria-expanded="false" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav id="menu" class="menu">
        <a href="{{root}}index.html">Home</a>
        <a href="#">Videos</a>
        <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <article class="post-content" id="post-content">
      <h1>{{title}}</h1>
      <p class="post-date">{{date}}</p>
{{hero}}
{{content}}
    </article>
  </main>

  <footer>
    <p>Copyright &copy; 2026 • Ojor Emmanuel • All rights reserved.</p>
  </footer>

  <script src="{{root}}scripts/script.js"></script>
</body>
</html>
